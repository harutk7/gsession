<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submission Received — TransLogix</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0d3b66 0%, #14548a 50%, #1b6fb8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
    padding: 64px 54px;
    text-align: center;
    max-width: 460px;
    width: 100%;
    animation: rise .5s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .check {
    width: 80px; height: 80px;
    background: #e6f6ec;
    color: #1d9e57;
    border-radius: 50%;
    font-size: 40px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 26px;
  }
  h1 { color: #10243e; font-size: 26px; margin-bottom: 12px; }
  p { color: #64748b; font-size: 15px; line-height: 1.65; margin-bottom: 32px; }
  a {
    display: inline-block;
    padding: 13px 32px;
    background: #0d3b66;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    transition: background .15s;
  }
  a:hover { background: #155a9c; }
</style>
</head>
<body>

<div class="card">
  <div class="check">&#10004;</div>
  <h1>Thank You for Your Submission!</h1>
  <p>Your driver registration has been received successfully.<br>
  Our team will review your details and contact you shortly.</p>
  <a href="#" onclick="history.back();return false;">Back to Form</a>
</div>

</body>
</html>
