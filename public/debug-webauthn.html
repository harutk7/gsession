<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gsession WebAuthn test</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  pre#out { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>gsession WebAuthn test</h2>
<pre id="out">starting…</pre>
<script>
const out = document.getElementById('out');
function log(msg) {
  out.textContent += msg + '\n';
  console.log(msg);
}
function b64url(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function createCred(label) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const userId = new TextEncoder().encode('gsession-test-' + label + '-' + Date.now());
  const selection =
    label === 'platform' ? { authenticatorAttachment: 'platform' } :
    label === 'cross'    ? { authenticatorAttachment: 'cross-platform' } : {};
  try {
    log(label + ': calling credentials.create…');
    const cred = await navigator.credentials.create({
      publicKey: {
        rp: { name: 'gsession', id: 'localhost' },
        user: { id: userId, name: 'gsession test', displayName: 'gsession test ' + label },
        challenge: new Uint8Array(challenge),
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        timeout: 12000,
        userVerification: 'preferred',
        attestation: 'none',
        authenticatorSelection: selection,
      },
    });
    const raw = cred.rawId ? new Uint8Array(cred.rawId) : new Uint8Array(0);
    log(label + ': OK credentialId=' + b64url(raw));
  } catch (e) {
    log(label + ': ERR ' + e.name + ' ' + e.message);
  }
}
(async () => {
  log('secure context: ' + window.isSecureContext);
  // default: one create (platform). ?n=3 runs all three like the old behaviour.
  const n = parseInt(new URLSearchParams(location.search).get('n') || '1', 10);
  const kinds = ['platform', 'cross', 'any'];
  for (let i = 0; i < Math.min(n, kinds.length); i++) await createCred(kinds[i]);
  log('ALL DONE');
})();
</script>
</body>
</html>
